# GüzelKabir API — nginx server block, spec §13, ADIM 11.
#
# PAYLAŞILAN droplet: bu dosya, mevcut nginx kurulumuna eklenen YENİ, BAĞIMSIZ
# bir server block'tur — mevcut hiçbir server block'a (node@3000, uvicorn@8000
# için olanlar dahil) dokunmaz.
#
# ⚠️ Droplet'in gerçek nginx durumu doğrulandı: `berber` adlı mevcut bir config
# `default_server` (listen 80 default_server; server_name _;) — eşleşmeyen
# TÜM istekler oraya düşüyor. Bu server block bilinçli olarak `default_server`
# BİLDİRMEZ ve `server_name`'i tam/kesin (aşağıda) — bu yüzden `berber`'in
# default_server statüsünü hiçbir şekilde değiştirmez/çalmaz. Bu satırı
# kaldırmayın veya server_name'i genişletmeyin (ör. bir wildcard'a).
#
# Domain gerçek ve DNS tam yayıldı (kullanıcı tarafından doğrulandı —
# guzelkabir.com/api.guzelkabir.com/admin.guzelkabir.com hepsi droplet'in
# gerçek IP'sine, 165.227.204.8'e çözümleniyor) — aşağıdaki "api.guzelkabir.com"
# artık bir placeholder değil, gerçek domain adı.
#
# Kurulum (droplet üzerinde, opsadmin/root ile):
#   1. Bu dosyayı /etc/nginx/sites-available/api.guzelkabir.com.conf olarak kopyala.
#   2. sudo ln -s /etc/nginx/sites-available/api.guzelkabir.com.conf /etc/nginx/sites-enabled/
#   3. sudo nginx -t   (mevcut config'i BOZMADIĞINI doğrula, syntax check)
#   4. sudo systemctl reload nginx
#   5. sudo certbot --nginx -d api.guzelkabir.com
#      certbot yalnızca -d ile verilen domain'e ait server block'u düzenler —
#      diğer (node@3000, uvicorn@8000 için olan) server block'lara dokunmaz.
#      Bu adım, aşağıdaki 443 bloğunu ve ssl_certificate satırlarını certbot
#      OTOMATİK olarak ekleyecek — bu dosyadaki 443 bloğu, certbot çalıştıktan
#      sonraki HALİYLE bırakıldı (certbot'un kendi eklediği örnek satırlarla),
#      ilk kurulumda yalnızca 80 bloğu (aşağıda) yeterli, certbot gerisini
#      kendisi yazacak.

server {
    listen 80;
    listen [::]:80;
    server_name api.guzelkabir.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # httpOnly refresh cookie'nin (spec §6, auth.service.ts) doğru
        # çalışması için gerekli — Origin/Host tutarlılığı.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # iyzico'nun callback POST'u (application/x-www-form-urlencoded,
    # PaymentsService.handleCallback) ve webhook'u (JSON) büyük olmayan
    # gövdeler — ekstra bir client_max_body_size gerekmiyor. Kanıt fotoğrafları
    # zaten backend'e hiç proxy edilmiyor (spec §8.1: doğrudan S3 presigned
    # URL), bu yüzden burada dosya yükleme boyutu bir endişe değil.
}

# --- certbot --nginx buradan sonrasını OTOMATİK ekleyecek (443 server block,
# ssl_certificate yolları, HTTP→HTTPS redirect). Elle eklemeyin — certbot'un
# kendi eklediği format, gelecekte `certbot renew` ile uyumlu kalması için
# ondan farklı elle yazılmış bir 443 bloğuyla çakışmamalı. ---
