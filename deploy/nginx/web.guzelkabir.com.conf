# GüzelKabir web (apps/web) — nginx server block, spec §13, ADIM 12.
#
# apps/web deploys as a static export (see apps/web/next.config.ts and
# CLAUDE.md's "Deployment (apps/web)" section) — no backend process, no
# proxy_pass. deploy-web.yml builds it in GitHub Actions and ships the
# static out/ directory to /var/www/guzelkabir-web via
# deploy/remote-deploy-web.sh (a SEPARATE forced-command SSH key from
# apps/api's — see deploy/README.md).
#
# PAYLAŞILAN droplet: bu dört server block, mevcut nginx kurulumuna
# eklenen YENİ, BAĞIMSIZ block'lardır — mevcut hiçbir server block'a
# (node@3000, uvicorn@8000, berber, yakupmertaslan.com dahil) dokunmaz.
#
# ⚠️ Droplet'te mevcut `berber` config'i default_server (server_name _;) —
# eşleşmeyen tüm istekler oraya düşüyor. Aşağıdaki server_name'ler
# (guzelkabir.com, www.guzelkabir.com) tam/kesin — default_server
# BİLDİRMİYORUZ, berber'in statüsü hiçbir şekilde değişmiyor.
#
# ⚠️ DEĞİŞTİ (canlı testte bulunan gerçek bug, düzeltildi): önceki sürüm
# yalnızca HTTP (80) block'larını tanımlıyor, 443 eşleniklerini VE
# HTTP→HTTPS redirect mantığını certbot'un `--nginx` eklentisine
# bırakıyordu. certbot'un varsayılan redirect davranışı, eşleşen HER
# domain'in 80 block'unu KENDİ genel "aynı host'a yönlendir" mantığıyla
# (`return 301 https://$host$request_uri;`) DEĞİŞTİRİYOR — bu, www
# block'undaki bizim özel `https://guzelkabir.com$request_uri` (apex'e
# yönlendirme) gövdesini SİLİP kendi `https://www.guzelkabir.com`
# yönlendirmesiyle ezdi (canlı doğrulandı: `curl -I http://www...` →
# www'ye yönlendiriyordu, apex'e değil). Düzeltme: certbot'un redirect
# yönetimine güvenmek yerine, HTTP + HTTPS'in DÖRDÜNÜ de burada elle
# tanımlıyoruz — certbot'un rolü artık yalnızca sertifika ÜRETMEK
# (zaten yapıldı), bu dosyanın redirect/serving mantığını bir daha asla
# düzenlemesine gerek yok.
#
# Kurulum (droplet üzerinde, opsadmin/root ile):
#   1. sudo mkdir -p /var/www/guzelkabir-web && sudo chown opsadmin:opsadmin /var/www/guzelkabir-web
#   2. Sertifika zaten üretilmiş olmalı (bkz. `sudo certbot certificates` —
#      lineage adı `guzelkabir.com` olmalı, -d listesindeki İLK domain bu
#      olduğu için; farklıysa aşağıdaki ssl_certificate yollarını ona göre
#      düzelt). Değilse önce: `sudo certbot certonly --nginx -d guzelkabir.com -d www.guzelkabir.com`
#   3. Bu dosyayı /etc/nginx/sites-available/web.guzelkabir.com.conf olarak kopyala
#      (certbot'un daha önce düzenlediği hâliyle olan eski içeriğin TAMAMEN
#      YERİNE — bu dosya kendi kendine yeterli, certbot'un eklediği hiçbir
#      şeye ihtiyaç duymuyor).
#   4. sudo ln -sf /etc/nginx/sites-available/web.guzelkabir.com.conf /etc/nginx/sites-enabled/
#   5. sudo nginx -t   (mevcut config'i BOZMADIĞINI doğrula)
#   6. sudo systemctl reload nginx
#   7. Doğrula (deploy/README.md'deki kontrol listesiyle aynı):
#      curl -I http://www.guzelkabir.com    # 301, Location: https://guzelkabir.com/
#      curl -I https://www.guzelkabir.com   # 301, Location: https://guzelkabir.com/
#      curl -I http://guzelkabir.com        # 301, Location: https://guzelkabir.com/
#      curl -I https://guzelkabir.com       # 200 (deploy yapılmadıysa 403 — bkz. CLAUDE.md, beklenen)

# --- www.guzelkabir.com: HER İKİ protokolde de apex'e 301 ---
server {
    listen 80;
    listen [::]:80;
    server_name www.guzelkabir.com;
    return 301 https://guzelkabir.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.guzelkabir.com;

    ssl_certificate /etc/letsencrypt/live/guzelkabir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guzelkabir.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://guzelkabir.com$request_uri;
}

# --- guzelkabir.com (apex, kanonik): HTTP sadece protokol yükseltir,
# HTTPS gerçek statik içeriği servis eder ---
server {
    listen 80;
    listen [::]:80;
    server_name guzelkabir.com;
    return 301 https://guzelkabir.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name guzelkabir.com;

    ssl_certificate /etc/letsencrypt/live/guzelkabir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guzelkabir.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/guzelkabir-web;
    index index.html;

    # Next.js static export (output: "export") düz .html dosyaları üretiyor
    # (giris.html, panel.html, siparis.html — nested değil, doğrulandı) —
    # bu yüzden $uri.html eşlemesi doğrudan çalışıyor.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
