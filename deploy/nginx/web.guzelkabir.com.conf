# GüzelKabir web (apps/web) — nginx server block, spec §13, ADIM 12.
#
# apps/web deploys as a static export (see apps/web/next.config.ts and
# CLAUDE.md's "Deployment (apps/web)" section) — no backend process, no
# proxy_pass. deploy-web.yml builds it in GitHub Actions and ships the
# static out/ directory to /var/www/guzelkabir-web via
# deploy/remote-deploy-web.sh (a SEPARATE forced-command SSH key from
# apps/api's — see deploy/README.md).
#
# PAYLAŞILAN droplet: bu iki server block, mevcut nginx kurulumuna eklenen
# YENİ, BAĞIMSIZ block'lardır — mevcut hiçbir server block'a (node@3000,
# uvicorn@8000, berber, yakupmertaslan.com dahil) dokunmaz.
#
# ⚠️ Droplet'te mevcut `berber` config'i default_server (server_name _;) —
# eşleşmeyen tüm istekler oraya düşüyor. Aşağıdaki server_name'ler
# (guzelkabir.com, www.guzelkabir.com) tam/kesin — default_server
# BİLDİRMİYORUZ, berber'in statüsü hiçbir şekilde değişmiyor.
#
# Kurulum (droplet üzerinde, opsadmin/root ile):
#   1. sudo mkdir -p /var/www/guzelkabir-web && sudo chown opsadmin:opsadmin /var/www/guzelkabir-web
#   2. Bu dosyayı /etc/nginx/sites-available/web.guzelkabir.com.conf olarak kopyala.
#   3. sudo ln -s /etc/nginx/sites-available/web.guzelkabir.com.conf /etc/nginx/sites-enabled/
#   4. sudo nginx -t   (mevcut config'i BOZMADIĞINI doğrula)
#   5. sudo systemctl reload nginx
#   6. sudo certbot --nginx -d guzelkabir.com -d www.guzelkabir.com
#      Tek sertifika, iki isim — certbot yalnızca bu iki domain'e ait server
#      block'ları düzenler, diğerlerine dokunmaz. 443 bloklarını ve
#      ssl_certificate satırlarını OTOMATİK ekleyecek — elle eklemeyin.

# www → apex (guzelkabir.com), 301 kalıcı yönlendirme. Kullanıcı onaylı
# karar (ADIM 12 planlaması) — aynı içeriği iki isimde servis etmek yerine
# tek bir kanonik domain kullanmak: yinelenen içerik/SEO sorunlarını önler,
# CORS_ORIGIN'i tek bir origin'e indirger (bkz. apps/api Doppler
# değişkenleri notu).
server {
    listen 80;
    listen [::]:80;
    server_name www.guzelkabir.com;
    return 301 https://guzelkabir.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name guzelkabir.com;

    root /var/www/guzelkabir-web;
    index index.html;

    # Next.js static export (output: "export") düz .html dosyaları üretiyor
    # (giris.html, panel.html, siparis.html — nested değil, doğrulandı) —
    # bu yüzden $uri.html eşlemesi doğrudan çalışıyor.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}

# --- certbot --nginx buradan sonra HER İKİ server block'a da kendi 443
# eşleniğini OTOMATİK ekleyecek (www için de bir 443+redirect, apex için
# ssl_certificate satırları). Elle eklemeyin. ---
