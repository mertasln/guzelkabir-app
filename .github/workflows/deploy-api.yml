name: Deploy API (production)

# spec §13.1: "production: manuel onaylı deploy (GitHub Actions environment
# protection rule)". Bu workflow, main'deki CI workflow'u başarıyla bittiğinde
# tetiklenir (aşağıdaki `on.workflow_run` notuna bakın) ama `deploy` job'ı
# `environment: production` altında — gerçek onay kapısı GitHub repo
# Settings → Environments → production'da tanımlı "required reviewers"
# kuralı (bu dosyadan ayarlanamaz, kullanıcı repo ayarlarından bir kez
# yapılandırmalı). Onaylanana kadar job beklemede kalır, otomatik çalışmaz.
#
# spec §13.2'nin "Docker image build + GHCR'ye push" adımı (33) BİLİNÇLİ
# olarak burada YOK — droplet paylaşılan/tek bir sunucu olduğu için (bkz.
# CLAUDE.md "Deployment" bölümü), image'ı CI'de build edip bir registry'ye
# push etmek + droplet'te ayrı bir registry-auth mekanizması kurmak, tek
# droplet'te doğrudan `git pull` + `docker compose build` yapmaktan daha
# fazla hareketli parça (ek bir secret, ek bir auth yüzeyi) ekliyordu, pilot
# ölçeğinde gerekli değildi — spec'in HA/multi-instance/Terraform
# gereksinimlerini kabul etmediğimiz aynı pilot-ölçek kararının devamı.
# Flaglenmiş bir basitleştirme, sessizce atlanmadı.
#
# ⚠️ SSH sertleştirmesi (kullanıcı talebi, ADIM 11 hardening pass'i): bu
# droplet PAYLAŞILAN — GüzelKabir dışında da aktif projeler var (nginx,
# node@3000, uvicorn@8000). DEPLOY_SSH_KEY secret'ı sızarsa, sınırsız bir
# opsadmin shell'i etki alanını tüm droplet'e (diğer projeler dahil)
# genişletirdi. Bunun önüne geçmek için droplet'teki
# ~opsadmin/.ssh/authorized_keys satırına bu anahtara özel bir
# `command="/bin/bash /opt/guzelkabir/deploy/remote-deploy.sh"` zorlaması
# eklenmiştir (bkz. deploy/README.md §2) — bu key ile açılan HER SSH
# oturumu, istemci ne gönderirse göndersin, SADECE bu script'i çalıştırabilir,
# genel bir shell açamaz. **Sonuç: aşağıdaki `script:` alanının içeriği
# sunucu tarafında YOK SAYILIR** — gerçek deploy mantığı artık bu workflow
# dosyasında değil, `deploy/remote-deploy.sh`'ta yaşıyor; deploy adımlarını
# değiştirmek için workflow'u değil, o script'i güncelleyin.
#
# Aynı sertleştirmenin bir sonucu: DOPPLER_TOKEN artık bir SSH oturum ortam
# değişkeni olarak GEÇİRİLMİYOR (forced-command altında istemcinin env-export
# enjeksiyonunun güvenilir şekilde ulaşacağı garanti değil) — token bunun
# yerine droplette /etc/guzelkabir/doppler-token'da (yalnızca opsadmin
# okuyabilir, mode 600) yerel olarak duruyor, remote-deploy.sh onu oradan
# okuyor (bkz. deploy/README.md §3). GitHub secrets listesinde artık bir
# DOPPLER_TOKEN YOK.
#
# ⚠️ Host key pinning (kullanıcı talebi, gerçek gap düzeltmesi) — bu adım
# eskiden `appleboy/ssh-action`'ı `fingerprint:` VERMEDEN kullanıyordu, yani
# hiçbir host key doğrulaması yapmıyordu (action'ın dokümantasyonu
# fingerprint verilmediğinde ne olduğunu bile belirtmiyor). Şimdi ham `ssh`
# çağrısına geçildi — deploy-web.yml'deki AYNI pinleme deseniyle: droplet'in
# gerçek host public key'i (kullanıcı tarafından doğrudan droplet'ten,
# `cat /etc/ssh/ssh_host_ed25519_key.pub` ile okunup buraya yapıştırıldı —
# ağ üzerinden değil, bu yüzden bir MITM tarafından sahtelenemez) aşağıda
# düz metin olarak duruyor (gizli değil, herkese açık bir anahtar) ve
# bağlanmadan HEMEN önce gerçek bir known_hosts dosyasına yazılıp
# `StrictHostKeyChecking=yes` ile zorunlu kılınıyor — "ilk bağlantı gibi
# davran" (accept-new, GitHub Actions'ın her çalıştırmada boş bir
# known_hosts'la başlaması yüzünden fiilen "asla doğrulama" anlamına
# geliyordu) değil, her seferinde gerçek kriptografik doğrulama.
on:
  # spec §13.2 adım 30-32 (lint/test/integration) BAŞARIYLA bitmeden deploy
  # pipeline'ı hiç başlamasın diye `push` değil, mevcut CI workflow'unun
  # ("CI", .github/workflows/ci.yml) SONUCUNU dinliyoruz — aynı push
  # event'inde iki workflow paralel koşup CI kırmızıyken bir reviewer'ın
  # yanlışlıkla onaylaması riskini yapısal olarak ortadan kaldırıyor.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_dispatch ile elle tetiklenirse (CI event'i yok) ya da CI
    # gerçekten başarılıysa çalış — CI başarısızken asla.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: production
    env:
      # Droplet'in gerçek SSH host public key'i — gizli değil (herkese açık
      # anahtar), bu yüzden düz metin. deploy-web.yml'deki AYNI değer.
      DEPLOY_SSH_HOST_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH1jUCMOT7k9MjaVMjLslqiOSjA3JpZPfCY7/tP/c4/h"
    steps:
      - name: Trigger deploy (forced SSH command runs deploy/remote-deploy.sh)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s %s\n' "$DEPLOY_SSH_HOST" "$DEPLOY_SSH_HOST_KEY" > "$known_hosts_file"
          # Gönderilen komutun içeriği önemsiz — authorized_keys'teki
          # command= zorlaması ne gönderilirse gönderilsin
          # deploy/remote-deploy.sh'ı çalıştırır (bkz. deploy/README.md §2).
          ssh -i "$key_file" -p "$DEPLOY_SSH_PORT" \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "echo ignored"
