name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    # apps/api'nin postinstall'ı (prisma generate) schema.prisma'nın
    # datasource url = env("DATABASE_URL") satırı yüzünden bu değişkenin
    # TANIMLI olmasını istiyor — gerçek bir bağlantı kurmuyor, sadece
    # client tiplerini üretiyor. Gerçek testler (apps/api/test/*.e2e-spec.ts)
    # kendi embedded Postgres'ini kuruyor, bu CI job'ında hiç çalışmıyor —
    # bu yüzden burada sahte bir değer yeterli.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build
